<title>Central Banker's Desk</title>
<meta name="description" content="A turn-based monetary policy game: steer inflation through news shocks, political pressure before an election, and advisors who disagree.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDEFE6; --panel:#E1E6D6; --raised:#F8F9F3;
  --ink:#1D2B26; --ink-soft:#56645C; --rule:#C3CBB8;
  --accent:#2F5D4E; --accent-ink:#F4F6EE; --gold:#9A6D22; --gold-soft:rgba(154,109,34,.12);
  --good:#2F7A4F; --warn:#A8741A; --crit:#A63A2B; --crit-ink:#FFF6F2;
  --pi:#A63A2B; --gap:#2E5A87; --rate:#2F5D4E; --cred:#2F5D4E; --pop:#9A6D22;
  --band:rgba(47,93,78,.10); --shadow:0 1px 0 rgba(29,43,38,.06), 0 8px 24px -14px rgba(29,43,38,.35);
  --f-display:"Old Standard TT", "Iowan Old Style", Georgia, serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --panel:#18211D; --raised:#1F2A25;
    --ink:#E3E8DC; --ink-soft:#9AA79E; --rule:#2F3B34;
    --accent:#7FB39F; --accent-ink:#0F1512; --gold:#D6A75A; --gold-soft:rgba(214,167,90,.12);
    --good:#6FC08F; --warn:#E0AE55; --crit:#E47C67; --crit-ink:#1A0F0C;
    --pi:#E47C67; --gap:#86ADDB; --rate:#7FB39F; --cred:#7FB39F; --pop:#D6A75A;
    --band:rgba(127,179,159,.12); --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --panel:#18211D; --raised:#1F2A25;
  --ink:#E3E8DC; --ink-soft:#9AA79E; --rule:#2F3B34;
  --accent:#7FB39F; --accent-ink:#0F1512; --gold:#D6A75A; --gold-soft:rgba(214,167,90,.12);
  --good:#6FC08F; --warn:#E0AE55; --crit:#E47C67; --crit-ink:#1A0F0C;
  --pi:#E47C67; --gap:#86ADDB; --rate:#7FB39F; --cred:#7FB39F; --pop:#D6A75A;
  --band:rgba(127,179,159,.12); --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:14px 48px;display:grid;gap:16px}
@media (max-width:480px){.wrap{padding-inline:16px}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}

/* Masthead */
.mast{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font:700 clamp(24px,3vw,32px)/1.05 var(--f-display);letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
.setup{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.field{display:grid;gap:3px}
.field select,.field input{background:var(--raised);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;min-width:0}
.field input{width:8ch;text-transform:uppercase;font-family:var(--f-mono)}
.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:7px 14px;font-weight:700}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{padding:12px 20px;font-size:16px}
.lang{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 9px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* HUD */
.hud{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--rule);gap:1px}
.hud > div{background:var(--raised);padding:9px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.hud .when{background:var(--ink);color:var(--paper)}
.hud .when .label{color:inherit;opacity:.7}
.hud .when b{font:700 22px/1.1 var(--f-display)}
.hud .when span.sub{font-size:12.5px;opacity:.85}
.hud b.v{font:500 21px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.hud small{font:500 12px var(--f-mono)}
.up{color:var(--crit)} .dn{color:var(--good)} .flat{color:var(--ink-soft)}
.meter{position:relative;height:6px;background:var(--rule);border-radius:3px;margin-top:4px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c,var(--accent))}
.meter em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
@media (max-width:900px){.hud{grid-template-columns:repeat(3,minmax(0,1fr))}.hud .when{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}}
@media (max-width:480px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.hud b.v{font-size:18px}}
.chip{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.03em;padding:0 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.crit{color:var(--crit)}

/* Main layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:22px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:minmax(0,1fr)}}
.stage{display:grid;gap:14px;min-width:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps span{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;color:var(--ink-soft);border:1px solid var(--rule)}
.steps span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps span.done{color:var(--accent);border-color:var(--accent)}
.steps i{flex:none;width:14px;height:1px;background:var(--rule)}
.stage-title{font:700 clamp(24px,2.8vw,30px)/1.1 var(--f-display)}
.feed{display:grid;gap:14px}
@media (prefers-reduced-motion: no-preference){
  .feed > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0) * 140ms)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* Breaking news lower-third */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);background:var(--raised);border:1px solid var(--rule)}
.banner .tag{background:var(--crit);color:var(--crit-ink);font:800 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:12px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.banner.data .tag{background:var(--accent);color:var(--accent-ink)}
.banner .body{padding:12px 16px;display:grid;gap:4px}
.banner h3{font:700 clamp(20px,2.4vw,26px)/1.15 var(--f-display)}
.banner p{margin:0;color:var(--ink-soft)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
.block{display:grid;gap:8px;align-content:start}
.press{display:grid;gap:0;border-top:2px solid var(--ink)}
.press div{padding:8px 0;border-bottom:1px solid var(--rule);display:grid;gap:1px}
.press b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.press span{font:400 16.5px/1.25 var(--f-display)}
.voice{font:italic 400 16px/1.35 var(--f-display);color:var(--ink-soft);padding-left:12px;border-left:2px solid var(--rule);margin:4px 0 0}

.phone{display:grid;gap:10px}
.msg{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body);background:var(--panel);border:1px solid var(--rule)}
.av.pres{background:var(--crit);color:var(--crit-ink);border-color:var(--crit)}
.av.fin{background:var(--gold);color:var(--paper);border-color:var(--gold)}
.bubble{background:var(--raised);border:1px solid var(--rule);border-radius:2px 12px 12px 12px;padding:8px 12px;box-shadow:var(--shadow)}
.bubble .who{font-size:12px;font-weight:700;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.bubble .who em{font-style:normal;font-weight:500;color:var(--ink-soft)}
.bubble p{margin:2px 0 0}
.pressure{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--crit)}
.pressure i{width:18px;height:6px;border-radius:1px;background:var(--rule)}
.pressure i.on{background:var(--crit)}
.quiet{color:var(--ink-soft);font-size:14px}

.alert{border:1px solid var(--crit);color:var(--crit);background:var(--raised);border-radius:4px;padding:8px 12px;font-size:14px;font-weight:600}

/* Dilemma */
.dilemma{border:2px solid var(--gold);background:var(--gold-soft);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.dilemma h3{font:700 21px/1.2 var(--f-display)}
.dilemma p{margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{text-align:left;border:1px solid var(--rule);background:var(--raised);border-radius:6px;padding:10px 12px;font-weight:600;line-height:1.35}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 11px;background:var(--paper)}

/* Advisors */
.advisors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.advisors{grid-template-columns:minmax(0,1fr)}}
.adv{border:1px solid var(--rule);border-radius:8px;background:var(--raised);padding:12px;display:grid;gap:8px;align-content:start}
.adv header{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.adv svg{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--rule)}
.adv h3{font:700 15.5px/1.15 var(--f-display)}
.adv .school{font-size:11.5px;color:var(--ink-soft)}
.adv p{margin:0;font-size:14px}
.adv footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec{font:500 13px var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--panel)}
.adv .follow{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}

/* Decision */
.decide{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:16px;display:grid;gap:14px}
.decide h3{font:700 20px/1.2 var(--f-display)}
.seg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.seg.tones{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.seg{grid-template-columns:repeat(4,minmax(0,1fr))}.seg.tones{grid-template-columns:minmax(0,1fr)}}
.seg button{border:1px solid var(--rule);background:var(--raised);border-radius:4px;padding:8px 4px;font:600 13px/1.2 var(--f-body);display:grid;gap:1px;justify-items:center}
.seg button small{font:500 11.5px var(--f-mono);color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg.tones button{padding:8px 10px;text-align:center}
.decide-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.newrate{font:500 15px var(--f-mono)}
.newrate b{font-size:24px;font-weight:500}
.tip{font-size:13px;color:var(--ink-soft);margin:0}

/* Reaction */
.verdict{display:grid;gap:4px}
.verdict h3{font:700 clamp(22px,2.6vw,28px)/1.15 var(--f-display)}
.moves-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
@media (max-width:560px){.moves-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.moves-row div{background:var(--raised);padding:8px 12px;display:grid;gap:1px}
.moves-row b{font:500 20px/1.15 var(--f-mono)}
.ledger{border:1px solid var(--rule);border-radius:8px;background:var(--raised);padding:12px 14px;display:grid;gap:6px;align-content:start}
.ledger h4{margin:0;display:flex;justify-content:space-between;align-items:baseline;font:700 16px var(--f-display)}
.ledger h4 span{font:500 18px var(--f-mono)}
.ledger ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ledger li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:13.5px;border-top:1px dashed var(--rule);padding-top:4px}
.ledger li span:last-child{font-family:var(--f-mono)}
.pos{color:var(--good)} .neg{color:var(--crit)}
.market{display:grid;gap:6px}
.market p{margin:0}
.election{border:2px solid var(--ink);border-radius:8px;padding:14px 16px;background:var(--raised);display:grid;gap:4px}
.election h3{font:700 22px/1.2 var(--f-display)}
.election p{margin:0}

/* Side charts */
.side{display:grid;gap:14px;min-width:0}
@media (max-width:980px) and (min-width:641px){.side{grid-template-columns:repeat(2,minmax(0,1fr))}}
figure{margin:0;display:grid;gap:3px;min-width:0}
figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline}
figcaption strong{font:700 15px/1.2 var(--f-display)}
.keys{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--ink-soft)}
.keys span::before{content:"";display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle;background:var(--c)}
.keys span.dash::before{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:11.5px var(--f-mono);fill:var(--ink-soft)}
svg.chart .grid{stroke:var(--rule);stroke-width:1}
svg.chart .zero{stroke:var(--ink-soft);stroke-width:1}

/* Tables */
section > h2{font:700 20px/1.2 var(--f-display);margin:0 0 8px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;background:var(--panel)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child,td.txt,th.txt{text-align:left}
td.txt{font-family:var(--f-body);white-space:normal;min-width:200px}
tr:last-child td{border-bottom:0}
td.empty{text-align:left;font-family:var(--f-body);color:var(--ink-soft)}
.lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.lower{grid-template-columns:minmax(0,1fr)}}
details{border-top:1px solid var(--rule);padding-top:12px}
summary{cursor:pointer;font:700 18px/1.3 var(--f-display)}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 24px;margin-top:12px;font-size:14px}
.explain p{margin:4px 0 0;max-width:62ch}
.eq{font-family:var(--f-mono);font-size:13px;background:var(--panel);border-radius:4px;padding:8px 10px;overflow-x:auto;white-space:nowrap}

/* Result dialog */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--raised);color:var(--ink);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,16,13,.6)}
.res{padding:22px;display:grid;gap:14px}
.res h2{font:700 30px/1.1 var(--f-display)}
.res .big{font:500 58px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.res .big.zero{color:var(--crit)}
.res dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0;font-size:14px}
.res dt{color:var(--ink-soft)} .res dd{margin:0;font-family:var(--f-mono);text-align:right}
.res .row{display:flex;flex-wrap:wrap;gap:10px}
.res p{margin:0}
.footnote{font-size:12.5px;color:var(--ink-soft)}
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <svg id="seal" width="44" height="44" viewBox="-50 -50 100 100" aria-hidden="true"></svg>
      <div>
        <h1>Central Banker's Desk</h1>
        <p data-t="tagline"></p>
      </div>
    </div>
    <div class="setup">
      <label class="field"><span class="label" data-t="scenario"></span><select id="scenario"></select></label>
      <label class="field"><span class="label" data-t="seed"></span><input id="seed" maxlength="8" spellcheck="false" autocomplete="off"></label>
      <button class="btn" id="newGame" data-t="newGame"></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">EN</button>
        <button id="lang-es" aria-pressed="false">ES</button>
      </div>
    </div>
  </header>

  <div class="hud" id="hud"></div>

  <div class="game">
    <main class="stage">
      <div class="steps" id="steps"></div>
      <h2 class="stage-title" id="stageTitle"></h2>
      <div class="feed" id="feed" aria-live="polite"></div>
    </main>
    <aside class="side">
      <figure><figcaption><strong data-t="chInfl"></strong><span class="keys"><span style="--c:var(--pi)" data-t="kInfl"></span><span class="dash" style="--c:var(--ink-soft)" data-t="kExp"></span></span></figcaption><svg class="chart" id="chInfl" viewBox="0 0 380 170"></svg></figure>
      <figure><figcaption><strong data-t="chGap"></strong><span class="keys"><span style="--c:var(--gap)" data-t="kGap"></span></span></figcaption><svg class="chart" id="chGap" viewBox="0 0 380 170"></svg></figure>
      <figure><figcaption><strong data-t="chRate"></strong><span class="keys"><span style="--c:var(--rate)" data-t="kRate"></span></span></figcaption><svg class="chart" id="chRate" viewBox="0 0 380 170"></svg></figure>
      <figure><figcaption><strong data-t="chPol"></strong><span class="keys"><span style="--c:var(--cred)" data-t="kCred"></span><span style="--c:var(--pop)" data-t="kPop"></span></span></figcaption><svg class="chart" id="chPol" viewBox="0 0 380 170"></svg></figure>
    </aside>
  </div>

  <div class="lower">
    <section>
      <h2 data-t="minutes"></h2>
      <div class="tbl"><table id="minutes"></table></div>
    </section>
    <section>
      <h2 data-t="record"></h2>
      <div class="tbl"><table id="board"></table></div>
    </section>
  </div>

  <details>
    <summary data-t="howTitle"></summary>
    <div class="explain" id="explain"></div>
  </details>
</div>

<dialog id="result"><div class="res" id="resBody"></div></dialog>

<script>
(() => {
"use strict";

/* ═══════════════ MODEL (pure: no DOM) ═══════════════ */
const M = {
  piStar: 2, rStar: 1, rho: 0.6, sigInv: 0.35, gMult: 0.3, g0: 20,
  kLag: 0.3, kNow: 0.1, sdD: 0.15, sdS: 0.12,
  turns: 12, election: 8, iMin: 0, iMax: 10,
  toneX: 0.2, tonePe: 0.35,
  credLose: 0.12, popFire: 25, popFireDefy: 38
};
const MOVES = [-1, -0.5, -0.25, 0, 0.25, 0.5, 1];

const SCEN = {
  random:   { year: 2027, q: 1, cred: 0.75 },
  oil:      { year: 1973, q: 3, cred: 0.6,
              d: [0, 0, -0.5, -0.3, 0, 0, 0, 0, 0, 0, 0, 0],
              s: [0, 1.6, 1.3, 0.8, 0.5, 0.3, 0, 0, 0, 0, 0, 0],

/* ═══════════════ GAME STATE ═══════════════ */
let lang = "en", game, draft;
const tr = () => T[lang];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const randomCode = () => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let k = 0; k < 5; k++) s += c[Math.floor(Math.random() * c.length)]; return s; };

const cur = () => game.hist[game.hist.length - 1];
const over = () => cur().t >= M.turns || !!cur().lost;
const freshDraft = () => ({ move: null, tone: "neutral", choice: null });

function startGame(cfg, inputs = [], phase = "brief") {
  const sc = buildScenario(cfg.scenario, cfg.seed);
  game = { cfg, sc, hist: [initState(sc)], reports: [], inputs: [], phase: "brief", saved: false };
  inputs.forEach(inp => advance(inp));
  game.phase = over() ? "react" : (phase === "board" ? "board" : "brief");
  game.prep = over() ? null : prepare(cur(), sc);
  if (over()) game.saved = true;
  draft = freshDraft();
  render(true);
}
function advance(inp) {
  const s = cur(), prep = prepare(s, game.sc), res = resolve(s, game.sc, prep, inp);
  game.inputs.push(inp); game.hist.push(res.state);
  game.reports.push({ prep, inp, prev: s, ...res });
}
function quarterLabel(k) {
  const z = game.sc.q - 1 + k;
  return `${game.sc.year + Math.floor(z / 4)} Q${(z % 4) + 1}`;
}

/* ═══════════════ BUILDERS: what the world says ═══════════════ */
function pressItems(s, prep) {
  const t = tr(), P = t.press, r = game.reports[game.reports.length - 1], out = [];
  const lastMove = r ? r.inp.move : 0;
  if (prep.t === M.election + 1 && s.govt === "opp") out.push(["ledger", P.newGov]);
  if (s.pi > 4) out.push(["ch9", P.hotPrices(pc(s.pi, 1))]);
  else if (s.pi < 0.5) out.push(["ch9", P.falling]);
  if (s.x < -2) out.push(["wire", P.layoffs]);
  else if (s.x > 2) out.push(["wire", P.shortage]);
  if (lastMove > 0) out.push(["ledger", P.hikeHit]);
  else if (lastMove < 0) out.push(["ledger", s.pi > 3 ? P.cutInfl : P.cutWelcome]);
  if (prep.toElection >= 0 && prep.toElection <= 3) out.push(["ch9", P.campaign(prep.toElection)]);
  if (s.pop < 40) out.push(["ledger", P.pollLow(Math.round(s.pop))]);
  else if (s.pop > 60) out.push(["ledger", P.pollHigh(Math.round(s.pop))]);
  if (s.cred < 0.4) out.push(["wire", P.doubt]);
  else if (s.cred > 0.85 && s.t > 0) out.push(["wire", P.trusted]);
  if (!out.length) out.push(["wire", P.calm]);
  return out.slice(0, 3);
}
function streetVoice(s) {
  const V = tr().street, r = game.reports[game.reports.length - 1];
  if (s.pi > 4) return V.prices;
  if (s.x < -2) return V.jobs;
  if (s.pi < 0.3) return V.deflation;
  if (r && r.inp.move > 0) return V.mortgage;
  if (s.x > 1.5) return V.boom;
  return V.fine;
}
function messages(s, prep) {
  const t = tr(), m = t.msgs, out = [];
  const pres = s.govt === "opp" ? PEOPLE.quiroga : PEOPLE.salas;
  const fin = s.govt === "opp" ? PEOPLE.brandt : PEOPLE.rios;
  const r = game.reports[game.reports.length - 1];
  if (prep.pressure === "hike") out.push(["pres", pres, t.roles.pres, m.hike]);
  else if (prep.pressure === "cut") {
    const txt = prep.toElection < 0 ? m.cutPost : prep.level === 3 ? m.cut3 : prep.level === 2 ? m.cut2(Math.max(1, prep.toElection)) : m.cut1;
    out.push(["pres", pres, t.roles.pres, txt]);
  } else if (s.pop > 55 && s.t > 0 && s.t % 3 === 0) out.push(["pres", pres, t.roles.pres, m.steady]);
  if (prep.g - s.g > 0.2) out.push(["fin", fin, t.roles.fin, m.spend((prep.g - s.g).toFixed(1))]);
  else if (s.govt === "opp" && prep.g < s.g - 0.2) out.push(["fin", fin, t.roles.fin, m.austerity]);
  if (s.govt === "inc") {
    if (r && r.inp.move < 0 && prep.toElection >= 0 && prep.toElection <= 3) out.push(["opp", PEOPLE.quiroga, t.roles.opp, m.oppCut]);
    else if (s.pop < 45 && prep.toElection >= 0) out.push(["opp", PEOPLE.quiroga, t.roles.opp, m.oppFail]);
  } else if (prep.t === M.election + 1) out.push(["opp", PEOPLE.salas, t.roles.exPres, m.oppWatch]);
  return out;
}
function advisorText(key, s, prep) {
  const A = tr().advText, m = prep.advisors[key];
  if (key === "keynes") {
    if (s.i <= 0.25 && s.x < -1) return A.kZlb;
    return m < 0 ? A.kCut(pc(s.x, 1)) : m > 0 ? A.kHike(pc(s.x, 1)) : A.kHold;
  }
  if (key === "friedman") return (m > 0 ? A.fHike(pc(s.pi, 1)) : m < 0 ? A.fCut : A.fHold) + (s.cred < 0.5 ? A.fCred : "");
  return A.tRule(pc(Math.max(0, taylorRate(s)), 2));
}
function warnings(s, prep) {
  const t = tr(), w = [];
  if (s.neg > 0) w.push(t.warnDefl(s.neg));
  if (s.hot > 0) w.push(t.warnInfl(s.hot));
  if (s.cred < 0.25) w.push(t.warnCred);
  if (prep.pressure === "cut" && prep.level >= 2 && s.pop < 42) w.push(t.warnFire);
  else if (s.pop < 32) w.push(t.warnPop);
  return w;
}

function chip(cls, text) { return `<span class="chip ${cls}">${esc(text)}</span>`; }
function delta(v, d, unit = "") { if (v == null) return ""; const cls = Math.abs(v) < 0.005 ? "flat" : v > 0 ? "pos" : "neg"; return `<small class="${cls}">${sgn(v, d)}${unit}</small>`; }

function renderHUD() {
  const t = tr(), s = cur(), prev = game.hist.length > 1 ? game.hist[game.hist.length - 2] : null, st = t.st;
  const miss = Math.abs(s.pi - 2);
  const piChip = s.pi < 0 || miss >= 3 ? chip("crit", st.danger) : miss < 1 ? chip("good", st.onTarget) : chip("warn", st.off);
  const xChip = Math.abs(s.x) < 1 ? chip("good", st.closed) : s.x < -3 ? chip("crit", st.deep) : s.x < 0 ? chip("warn", st.slack) : chip(s.x > 3 ? "crit" : "warn", st.hot);
  const cChip = s.cred > 0.7 ? chip("good", st.anchored) : s.cred > 0.3 ? chip("warn", st.shaky) : chip("crit", st.lost);
  const pChip = s.pop >= 50 ? chip("good", st.safe) : s.pop >= 35 ? chip("warn", st.tense) : chip("crit", st.risk);
  const toE = M.election - (game.phase === "react" ? s.t : s.t + 1);
  const turnNo = Math.min(M.turns, game.phase === "react" ? s.t : s.t + 1);
  const qLabel = quarterLabel(turnNo);
  const dv = (k, mult = 1) => prev ? (s[k] - prev[k]) * mult : null;
  $("hud").innerHTML = `
    <div class="when"><span class="label">${esc(t.turn(turnNo, M.turns))}</span><b>${qLabel}</b><span class="sub">${esc(t.electionIn(toE))}</span></div>
    <div><span class="label">${t.hud.pi}</span><b class="v">${pc(s.pi)} ${delta(dv("pi"), 2)}</b>${piChip}</div>
    <div><span class="label">${t.hud.x}</span><b class="v">${pc(s.x)} ${delta(dv("x"), 2)}</b>${xChip}</div>
    <div><span class="label">${t.hud.i}</span><b class="v">${pc(s.i)} ${prev ? `<small class="flat">${sgn(s.i - prev.i)}</small>` : ""}</b></div>
    <div><span class="label">${t.hud.cred}</span><b class="v">${Math.round(s.cred * 100)} ${delta(dv("cred", 100), 0)}</b><div class="meter" style="--c:var(--cred)"><i style="width:${s.cred * 100}%"></i><em style="left:12%"></em></div>${cChip}</div>
    <div><span class="label">${t.hud.pop}</span><b class="v">${Math.round(s.pop)}% ${delta(dv("pop"), 0)}</b><div class="meter" style="--c:var(--pop)"><i style="width:${s.pop}%"></i><em style="left:50%"></em></div>${pChip}</div>`;
}

  const warns = warnings(s, prep).map(w => `<div class="alert" role="status">${esc(w)}</div>`).join("");
  let dil = "";
  if (prep.dilemma) {
    const [h, body, a, b] = t.dilemmas[prep.dilemma];
    dil = `<div class="dilemma" ${n(1)}><span class="label">${esc(t.dilemmaHead)}</span><h3>${esc(h)}</h3><p>${esc(body)}</p>

  }).join("");

  }).join("");

      <div class="block"><span class="label">${esc(t.toneLabel)}</span><div class="seg tones" role="group">${tones}</div><p class="tip">${esc(t.toneTip(Math.round(s.cred * 100)))}</p></div>
      <div class="decide-foot"><span class="newrate">${esc(t.newRate)}: <b>${newRate}</b></span>
        <span style="display:grid;gap:4px;justify-items:end">${prep.dilemma && draft.choice == null ? `<span class="tip">${esc(t.chooseFirst)}</span>` : ""}<button class="btn primary big" id="announce" ${ready ? "" : "disabled"}>${esc(t.announce)}</button></span></div>
    </div>`;
  const rerender = () => { const y = window.scrollY; renderBoardNoAnim(); window.scrollTo(0, y); };
  $("feed").querySelectorAll("[data-choice]").forEach(b => b.onclick = () => { draft.choice = +b.dataset.choice; rerender(); });
  $("feed").querySelectorAll("[data-move]").forEach(b => b.onclick = () => { draft.move = +b.dataset.move; rerender(); });
  $("feed").querySelectorAll("[data-follow]").forEach(b => b.onclick = () => { draft.move = +b.dataset.follow; rerender(); });
  $("feed").querySelectorAll("[data-tone]").forEach(b => b.onclick = () => { draft.tone = b.dataset.tone; rerender(); });
  $("announce").onclick = () => {
    if (!ready) return;
    advance({ move: draft.move, tone: draft.tone, choice: prep.dilemma ? draft.choice : null });
    game.phase = "react"; draft = freshDraft();
    render(true);
    window.scrollTo({ top: Math.min(window.scrollY, $("hud").offsetTop - 8), behavior: "smooth" });

function renderReact() {
  const t = tr(), r = game.reports[game.reports.length - 1], s = r.state, p = r.prev;
  $("stageTitle").textContent = over() && game.saved && !r ? t.titles.over : t.titles.react(quarterLabel(s.t));
  const toneName = t.tones[r.inp.tone][0];
  const cd = (s.cred - p.cred) * 100, pd = s.pop - p.pop;
  const ledger = (title, total, parts, why, scale, d) => `<div class="ledger"><h4>${esc(title)} <span class="${total >= 0 ? "pos" : "neg"}">${sgn(total, d)}</span></h4><ul>${parts.map(([k, v]) => `<li><span>${esc(why[k])}</span><span class="${v >= 0 ? "pos" : "neg"}">${sgn(v * scale, d)}</span></li>`).join("")}</ul></div>`;
  const market = r.surprise >= 0.25 ? t.market.hawk : r.surprise <= -0.25 ? t.market.dove : t.market.none;
  const verdict = t.verdict[(cd >= 0 ? "u" : "d") + (pd >= 0 ? "u" : "d")];
  let elec = "";
  if (r.election) {
    const [h, body] = r.election === "reelected" ? t.elec.reelected(Math.round(s.pop)) : t.elec.defeated();
    elec = `<div class="election" ${n(1)}><span class="label">${esc(t.elecRes)}</span><h3>${esc(h)}</h3><p>${esc(body)}</p></div>`;
  }
  const lost = s.lost ? `<div class="alert" ${n(1)}><strong>${esc(t.outcome[s.lost])}.</strong> ${esc(t.lostWhy[s.lost])}</div>` : "";
  const cell = (label, val, dv) => `<div><span class="label">${esc(label)}</span><b>${val}</b>${dv}</div>`;
  $("feed").innerHTML = `
    <div class="verdict" ${n(0)}><span class="label">${esc(t.outcomeHead)}</span><h3>${esc(t.decided(r.inp.move, pc(s.i), toneName))}</h3></div>
    ${lost}${elec}
    <div class="moves-row" ${n(2)}>
      ${cell(t.hud.pi, pc(s.pi), delta(s.pi - p.pi, 2))}
      ${cell(t.hud.x, pc(s.x), delta(s.x - p.x, 2))}
      ${cell(t.hud.cred, Math.round(s.cred * 100), delta(cd, 0))}
      ${cell(t.hud.pop, Math.round(s.pop) + "%", delta(pd, 0))}
    </div>
    <div class="two" ${n(3)}>
      ${ledger(t.credHead, cd, r.credParts, t.credWhy, 100, 0)}
      ${ledger(t.popHead, pd, r.popParts, t.popWhy, 1, 1)}

  $("nextQ").onclick = () => {
    if (over()) { finish(); return; }
    game.prep = prepare(cur(), game.sc); game.phase = "brief"; render(true);
  };
}

function niceTicks(lo, hi, cnt = 4) {
  const span = hi - lo || 1, raw = span / cnt, mag = 10 ** Math.floor(Math.log10(raw));
  const stepv = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw);
  const a = Math.floor(lo / stepv) * stepv, b = Math.ceil(hi / stepv) * stepv, out = [];
  for (let v = a; v <= b + stepv / 2; v += stepv) out.push(+v.toFixed(6));
  return out;
}
function drawChart(svg, { series, refs = [], band, include = [], fixed }) {
  const W = 380, H = 170, ml = 34, mr = 8, mt = 16, mb = 22, N = M.turns;
  let lo, hi;
  if (fixed) [lo, hi] = fixed;
  else {
    const vals = include.slice();
    series.forEach(se => vals.push(...se.values)); refs.forEach(r => vals.push(r.y)); if (band) vals.push(...band);
    lo = Math.min(...vals); hi = Math.max(...vals);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  }
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = k => ml + (k * (W - ml - mr)) / N, Y = v => mt + ((hi - v) * (H - mt - mb)) / (hi - lo);
  const t = tr();
  let o = "";
  ticks.forEach(v => { o += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 5}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(2)}</text>`; });
  [0, 4, 8, 12].forEach(k => { o += `<text x="${X(k)}" y="${H - 5}" text-anchor="${k === 0 ? "start" : k === 12 ? "end" : "middle"}">${quarterLabel(k).replace(" ", "")}</text>`; });
  o += `<line x1="${X(M.election)}" x2="${X(M.election)}" y1="${mt - 4}" y2="${H - mb}" stroke="var(--gold)" stroke-dasharray="3 3"/><text x="${X(M.election) + 4}" y="${mt - 4}" style="fill:var(--gold)">${esc(t.electionMark)}</text>`;
  if (band) o += `<rect x="${ml}" width="${W - ml - mr}" y="${Y(band[1])}" height="${Y(band[0]) - Y(band[1])}" fill="var(--band)"/>`;
  if (lo < 0 && hi > 0) o += `<line class="zero" x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  refs.forEach(r => { o += `<line x1="${ml}" x2="${W - mr}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="var(--accent)" stroke-dasharray="2 3"/>`; if (r.label) o += `<text x="${ml + 4}" y="${Y(r.y) - 4}" style="fill:var(--accent)">${esc(r.label)}</text>`; });
  series.forEach(se => {
    const v = se.values;
    if (se.type === "bar") {
      const bw = ((W - ml - mr) / N) * 0.56;
      v.forEach((val, k) => { if (k === 0) return; const y0 = Y(Math.max(0, val)), y1 = Y(Math.min(0, val));
        o += `<rect x="${X(k) - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(1, y1 - y0)}" fill="${se.color}" opacity="${k === v.length - 1 ? 1 : 0.55}"/>`; });
      return;
    }
    let d = "";
    v.forEach((val, k) => { d += se.type === "step" && k > 0 ? ` H${X(k)} V${Y(val)}` : `${k ? " L" : "M"}${X(k)} ${Y(val)}`; });
    o += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.dash ? 1.5 : 2.2}" ${se.dash ? 'stroke-dasharray="4 3"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (!se.dash) { const k = v.length - 1; o += `<circle cx="${X(k)}" cy="${Y(v[k])}" r="3.4" fill="${se.color}" stroke="var(--paper)" stroke-width="1.5"/>`; }
  });
  svg.innerHTML = o;
}

function renderCharts() {
  const t = tr(), H = game.hist;
  drawChart($("chInfl"), { series: [{ values: H.map(h => h.pe), color: "var(--ink-soft)", dash: true }, { values: H.map(h => h.pi), color: "var(--pi)" }], band: [1, 3], refs: [{ y: 2, label: t.target }], include: [0, 4] });
  drawChart($("chGap"), { series: [{ values: H.map(h => h.x), color: "var(--gap)", type: "bar" }], include: [-2, 2] });
  drawChart($("chRate"), { series: [{ values: H.map(h => h.i), color: "var(--rate)", type: "step" }], include: [0, 5] });
  drawChart($("chPol"), { series: [{ values: H.map(h => h.cred * 100), color: "var(--cred)" }, { values: H.map(h => h.pop), color: "var(--pop)" }], fixed: [0, 100], refs: [{ y: 50 }] });
}

function render(animate) {
  const t = tr();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("lang-en").setAttribute("aria-pressed", lang === "en"); $("lang-es").setAttribute("aria-pressed", lang === "es");
  $("scenario").innerHTML = Object.keys(SCEN).map(k => `<option value="${k}"${k === game.cfg.scenario ? " selected" : ""}>${esc(t.scen[k])}</option>`).join("");
  $("seed").value = game.cfg.seed;
  renderHUD(); renderSteps();
  if (game.phase === "brief") renderBrief();
  else if (game.phase === "board") animate ? renderBoard() : renderBoardNoAnim();
  else renderReact();
  if (!animate) $("feed").querySelectorAll(":scope > *").forEach(el => (el.style.animation = "none"));
  renderCharts(); renderMinutes(); renderRecord();
  $("explain").innerHTML = t.explain.map(([h, eq, p]) => `<div><span class="label">${esc(h)}</span><div class="eq">${esc(eq)}</div><p>${esc(p)}</p></div>`).join("");
}

function finish() {
  const t = tr(), s = cur(), H = game.hist, T_ = s.t || 1;
  const sp = scoreParts(s), rb = ruleBound(game.sc), rbs = scoreParts(rb).total;
  if (!game.saved) {
    game.saved = true;
    const b = loadBoard();
    b.unshift({ date: new Date().toISOString().slice(0, 10), scenario: game.cfg.scenario, seed: game.cfg.seed, score: sp.total, outcome: s.lost || "done" });
    saveBoard(b); renderRecord();
  }
  const avg = (a, b) => (((b / a) ** (1 / T_) - 1) * 400);
  const diff = sp.total - rbs;
  const elecR = game.reports.find(r => r.election);
  const verdict = s.lost ? t.lostWhy[s.lost] : t.epilogue(s.cred);
  const cmp = diff > 0 ? t.beat(diff) : diff < 0 ? t.lostTo(-diff) : t.tied;
  $("resBody").innerHTML = `
    <span class="label">${esc(t.scen[game.cfg.scenario])} · ${esc(game.cfg.seed)}</span>
    <h2>${esc(s.lost ? t.outcome[s.lost] : t.doneTitle)}</h2>
    <p>${esc(verdict)}</p>
    <div><span class="label">${esc(t.score)}</span><div class="big${sp.total ? "" : " zero"}">${sp.total}</div></div>
    <dl>
      <dt>${esc(t.parts.macro)}</dt><dd>${sp.macro}</dd>
      <dt>${esc(t.parts.cred)}</dt><dd>${sp.cred}</dd>
      <dt>${esc(t.parts.pop)}</dt><dd>${sp.pop}</dd>
      <dt>${esc(t.rule)}</dt><dd>${rbs}</dd>
      <dt>${esc(t.avgGdp)}</dt><dd>${pc(avg(H[0].Y, s.Y))}</dd>
      <dt>${esc(t.avgPrice)}</dt><dd>${pc(avg(H[0].P, s.P))}</dd>
      ${elecR ? `<dt>${esc(t.elecRes)}</dt><dd>${esc(elecR.election === "reelected" ? t.elec.reelected(0)[0] : t.elec.defeated()[0])}</dd>` : ""}
    </dl>
    <p><strong>${esc(cmp)}</strong></p>
    <p class="footnote">${esc(t.ruleNote)}</p>
    <div class="row">
      <button class="btn primary" id="rReplay">${esc(t.replay)}</button>
      <button class="btn" id="rFresh">${esc(t.fresh)}</button>
      <button class="btn" id="rClose">${esc(t.close)}</button>
    </div>`;
  const dlg = $("result");
  $("rReplay").onclick = () => { dlg.close(); startGame({ ...game.cfg }); };
  $("rFresh").onclick = () => { dlg.close(); startGame({ scenario: game.cfg.scenario, seed: randomCode() }); };
  $("rClose").onclick = () => dlg.close();
  if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
}

/* ═══════════════ WIRING ═══════════════ */
function drawSeal() {
  let o = "";
  for (let r = 0; r < 3; r++) {
    let d = "";
    for (let a = 0; a <= 360; a += 3) {
      const th = (a * Math.PI) / 180, rad = 34 + r * 5 + 4 * Math.sin(12 * th + r);
      d += `${a ? "L" : "M"}${(rad * Math.cos(th)).toFixed(2)} ${(rad * Math.sin(th)).toFixed(2)}`;
    }
    o += `<path d="${d}Z" fill="none" stroke="currentColor" stroke-width="0.9" opacity="${0.9 - r * 0.25}"/>`;
  }
  o += `<circle r="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text y="9" text-anchor="middle" font-family="Old Standard TT, Georgia, serif" font-size="26" font-weight="700" fill="currentColor">%</text>`;
  $("seal").innerHTML = o;
}

function bind() {
  $("newGame").onclick = () => {
    const code = ($("seed").value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    startGame({ scenario: $("scenario").value, seed: code && code !== game.cfg.seed ? code : randomCode() });
  };
  $("scenario").onchange = e => startGame({ scenario: e.target.value, seed: game.cfg.seed });
  const setLang = l => { lang = l; try { localStorage.setItem("cbdesk.lang", l); } catch {} render(false); if ($("result").open) finish(); };
  $("lang-en").onclick = () => setLang("en"); $("lang-es").onclick = () => setLang("es");
}

function start(data) {
  let saved = null; try { saved = localStorage.getItem("cbdesk.lang"); } catch {}
  lang = data?.lang || saved || ((navigator.language || "").startsWith("es") ? "es" : "en");
  if (!T[lang]) lang = "en";
  drawSeal(); bind();
  startGame(data?.cfg || { scenario: "random", seed: randomCode() }, data?.inputs || [], data?.phase);
  window.claude?.hot?.snapshot?.(() => ({ cfg: game.cfg, inputs: game.inputs, phase: game.phase, lang }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
