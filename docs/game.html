<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold the Line</title>
<meta name="description" content="A central banker video game: breaking news, a ringing phone before the election, advisors who disagree, and the whole country commenting on your rate decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>
:root{
  --bg:#0A0F1D; --bg-2:#0F1627; --surface:#161F36; --surface-2:#1D2844;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --text:#EEF1F7; --muted:#9AA4BD; --faint:#6B7591;
  --amber:#F2B650; --red:#E5484D; --green:#3FB68B; --blue:#5B9BD5;
  --paper:#F5EFE3; --paper-ink:#1E1B16; --paper-muted:#6C6457; --paper-line:#DCD2BF;
  --f-ui:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-news:"Newsreader", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#18223D 0%,#0A0F1D 60%) fixed,#0A0F1D;color:var(--text);font:16px/1.5 var(--f-ui)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.shell{min-height:100%;display:grid;justify-items:center;align-content:start;padding-inline:16px;padding-block:18px 28px}
#frame{position:relative;width:100%;max-width:1100px;min-height:clamp(580px,92vh,820px);display:grid;grid-template-rows:auto auto auto 1fr;background:var(--bg-2);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2),0 40px 80px -30px rgba(0,0,0,.8)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}

/* HUD */
.hud{display:grid;grid-template-columns:auto repeat(3,minmax(0,.75fr)) repeat(2,minmax(0,1.25fr)) auto;background:#0A0F1D;border-bottom:1px solid var(--line)}
.hud>*{padding:10px 14px;border-right:1px solid var(--line);min-width:0;display:grid;align-content:center;gap:4px}
.hw-date{font:800 19px/1 var(--f-ui);font-stretch:112%}
.hw-turn{font:500 12.5px var(--f-ui);color:var(--muted);white-space:nowrap}
.pill{justify-self:start;font:700 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(242,182,80,.14);color:var(--amber);white-space:nowrap}
.pill.hot{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.t-lab{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-val{font:800 22px/1 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-val small{font:600 12px var(--f-ui);margin-left:5px}
.good{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}
.t-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-num{font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.mbar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.08)}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c);box-shadow:0 0 14px -2px var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mbar em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:rgba(255,255,255,.45)}
.mbar em.danger{background:var(--red)}
.hud .hud-btns{display:flex;gap:6px;align-items:center;border-right:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.12)}
@media (max-width:900px){
  .hud{grid-template-columns:repeat(6,minmax(0,1fr))}
  .hud>*{border-bottom:1px solid var(--line);grid-column:span 2}
  .hud .hud-when{grid-column:span 4;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .hud .hud-btns{order:-1;grid-column:span 2;justify-content:flex-end;order:0}
  .hud .meter-tile{grid-column:span 3}
}

/* Office scene */
.room{position:relative;height:clamp(230px,40vh,390px);overflow:hidden;background:linear-gradient(180deg,#1B2440 0%,#141C33 70%,#10172B 100%)}
.room::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 38px);pointer-events:none}
.room::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.45));pointer-events:none;z-index:4}
.window{position:absolute;left:30%;top:7%;width:37%;height:60%;border-radius:3px;overflow:hidden;box-shadow:0 0 0 10px #2B2019,0 0 0 12px #17100C,0 24px 50px rgba(0,0,0,.55)}
.window svg{width:100%;height:100%;display:block}
.shelf{position:absolute;left:3%;top:10%;height:64%;aspect-ratio:.7;filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
.shelf svg{height:100%;width:100%;display:block}
.tv{position:absolute;right:3.5%;top:8%;width:clamp(180px,27%,340px);aspect-ratio:16/10;padding:7px;border-radius:12px;background:linear-gradient(#262B3C,#0B0E16);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);container-type:inline-size}
.screen{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#1B2438,#05070C)}
.screen::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09),transparent 42%);pointer-events:none;z-index:3}
.tv-news{position:absolute;inset:0;background:radial-gradient(90% 90% at 75% 20%,#35609E,#12203D 70%);animation:fade .4s both}
.tv-news::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 12%,rgba(255,255,255,.05) 12% 15%)}
.tv-anchor{position:absolute;left:5%;bottom:0;height:86%}
.tv-anchor svg{height:100%;width:auto;display:block}
.tv-bug{position:absolute;top:6%;right:5%;display:flex;gap:1.6cqw;align-items:center;font:800 5cqw/1 var(--f-ui);color:#fff;letter-spacing:.04em}
.tv-bug i{width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
.tv-lower{position:absolute;left:0;right:0;bottom:7%;display:grid;grid-template-columns:auto minmax(0,1fr);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.tv-tag{background:var(--red);color:#fff;font:800 4.2cqw/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:2.2cqw 2.4cqw;display:grid;place-items:center}
.tv-tag.live{background:var(--green)}
.tv-crawl{background:var(--paper);color:#10131C;font:700 4.6cqw/1 var(--f-ui);overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tv-crawl span{display:inline-block;padding:0 3cqw;animation:crawl 14s linear infinite}
@keyframes crawl{0%,18%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.desk{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(#5E4232,#3A281F 35%,#271A14);box-shadow:inset 0 3px 0 rgba(255,255,255,.08),0 -12px 30px rgba(0,0,0,.35);z-index:1}
.nameplate{position:absolute;left:43%;top:18%;padding:4px 12px;font:700 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:#F2D9A0;background:linear-gradient(#3F2E22,#20160F);border:1px solid #6B4E2E;border-radius:3px;white-space:nowrap}
.lamp-glow{position:absolute;left:47%;bottom:0;width:42%;height:72%;background:radial-gradient(closest-side,rgba(242,182,80,.26),transparent);mix-blend-mode:screen;pointer-events:none;z-index:2}
.lamp{position:absolute;bottom:12%;left:63%;height:36%;aspect-ratio:.8;z-index:2}
.lamp svg,.phone svg{width:100%;height:100%;display:block}
.phone{position:absolute;bottom:6%;left:77%;height:16%;aspect-ratio:1.5;z-index:2}
.phone.ring svg{animation:ring .13s ease-in-out 12}
.phone.ring::after{content:"";position:absolute;inset:-30% -10%;border-radius:50%;border:2px solid rgba(229,72,77,.7);animation:wave 1s ease-out 2}
@keyframes ring{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes wave{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (max-width:700px){.shelf,.nameplate{display:none}.window{left:5%;width:54%}.tv{width:37%;right:3%}.lamp{left:60%}}
.cast{position:absolute;left:4%;bottom:0;height:94%;display:flex;align-items:flex-end;gap:1%;z-index:3;pointer-events:none}
.bust{position:relative;height:100%;flex:none;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));animation:enter .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0) * 90ms)}
.bust svg{height:100%;width:auto;display:block}
.cast.row .bust{height:min(84%,33vw)}
.bust.call{height:84%;margin-bottom:2%;padding:12px 12px 0;border-radius:20px 20px 0 0;background:linear-gradient(180deg,rgba(35,47,78,.94),rgba(14,19,34,.97));box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 7px rgba(242,182,80,.16);animation:enter .45s both,callpulse 1.6s ease-in-out infinite}
@keyframes callpulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 7px rgba(229,72,77,.3)}}
.call-pill{position:absolute;top:-14px;left:14px;display:flex;gap:6px;align-items:center;font:700 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#1A1406;padding:4px 10px;border-radius:99px;white-space:nowrap}
.call-pill i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse .8s infinite}
.prop{flex:none;height:60%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));animation:enter .45s both}
.prop svg{height:100%;width:auto;display:block}
.prop.podium{height:80%;margin-left:24%}
.prop.newspaper{height:52%;margin-left:4%;margin-bottom:1%}
.prop.folder{height:50%;margin-left:4%;margin-bottom:2%}
.flash{position:absolute;inset:0;background:#fff;z-index:40;pointer-events:none;animation:flash .35s ease-out forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}
#frame.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
.floater{position:absolute;z-index:35;font:800 18px var(--f-ui);pointer-events:none;padding:2px 8px;border-radius:99px;animation:floatUp 1.8s ease-out forwards}
.floater.up{color:#0B1A12;background:var(--green)} .floater.down{color:#fff;background:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translateY(-6px)}15%{opacity:1}100%{opacity:0;transform:translateY(34px)}}

/* News ticker */
.newsbar{display:flex;align-items:stretch;background:#070B16;border-bottom:1px solid var(--line);height:36px;overflow:hidden}
.nb-live{display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--red);color:#fff;font:800 12px var(--f-ui);letter-spacing:.14em}
.nb-live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.nb-track{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.nb-move{display:inline-flex;white-space:nowrap;align-items:center;height:100%;animation:marquee var(--dur,50s) linear infinite}
.nb-move span{font:500 14px var(--f-ui);color:var(--text);padding-right:44px}
.nb-move span b{color:var(--amber);font-weight:700;margin-right:8px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
@keyframes marquee{to{transform:translateX(-50%)}}
</style>

<style>
/* Panel & dialogue */
.panel{position:relative;background:linear-gradient(180deg,#111A2F,#0D1424);padding:20px 22px 18px;display:grid;min-height:250px}
.dlg{display:grid;gap:12px;align-content:start;min-width:0}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.who b{font:800 15px var(--f-ui);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.who b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.who span{font:500 13.5px var(--f-ui);color:var(--muted)}
.dlg-text{margin:0;font:400 clamp(18px,2vw,21px)/1.5 var(--f-ui);max-width:68ch;text-wrap:pretty}
.dlg-text:empty{display:none}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px}
.btn{font:700 14px/1 var(--f-ui);letter-spacing:.02em;border:0;border-radius:10px;padding:12px 18px;background:var(--amber);color:#1B1405;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(242,182,80,.7);transition:transform .12s,filter .12s,background .12s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;filter:none;transform:none}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.11)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 8px 20px -8px rgba(229,72,77,.8)}
.btn.big{font-size:16px;padding:15px 24px;border-radius:12px}
.btn.small{font-size:13px;padding:8px 12px;border-radius:8px}
.sec-lab{font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Newspaper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px 14px;box-shadow:0 24px 44px -24px rgba(0,0,0,.7);display:grid;gap:12px;animation:enter .45s both}
.paper-mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
.pm-name{font:700 clamp(24px,3.2vw,34px)/1 var(--f-news);letter-spacing:-.01em;text-align:center;white-space:nowrap}
.pm-meta{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted)}
.pm-meta:last-child{text-align:right}
.paper-body{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.paper-body{grid-template-columns:minmax(0,1fr)}.pm-meta{display:none}.paper-mast{grid-template-columns:1fr}}
.kicker{font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#B3261E}
.paper-lead h3{margin:2px 0 6px;font:700 clamp(22px,2.8vw,31px)/1.08 var(--f-news);text-wrap:balance}
.paper-lead p{margin:0;font:400 16.5px/1.45 var(--f-news);color:#3D372E}
.paper-side{border-left:1px solid var(--paper-line);padding-left:14px;display:grid;gap:10px;align-content:start}
@media (max-width:640px){.paper-side{border-left:0;padding-left:0;border-top:1px solid var(--paper-line);padding-top:10px}}
.paper-side div{display:grid;gap:1px}
.paper-side small{font:700 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted)}
.paper-side h4{margin:0;font:600 16px/1.25 var(--f-news)}
.comments{border-top:1px solid var(--paper-line);padding-top:10px;display:grid;gap:10px}
.c-head{font:700 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted)}
.comment{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;animation:enter .4s both;animation-delay:calc(.35s + var(--n) * .3s)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-ui);color:#fff;background:var(--c);flex:none}
.c-who{font:700 13.5px var(--f-ui)}
.c-who span{font-weight:500;color:var(--paper-muted)}
.comment p{margin:1px 0 0;font:400 15.5px/1.4 var(--f-ui)}
.c-foot{display:flex;gap:14px;font:600 12px var(--f-ui);color:var(--paper-muted);margin-top:3px}
.c-foot span,.p-foot span{display:inline-flex;gap:4px;align-items:center}

/* Live reaction */
.react{display:grid;gap:14px}
.react-head{display:grid;gap:4px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(229,72,77,.18),rgba(255,255,255,.03) 60%);box-shadow:inset 0 0 0 1px var(--line-2);animation:enter .4s both}
.react-src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.react-src .pill{margin:0}
.react-head h3{margin:0;font:700 clamp(21px,2.5vw,28px)/1.12 var(--f-news);text-wrap:balance}
.mkts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mkt{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:2px;animation:enter .4s both;animation-delay:calc(.15s + var(--n) * .1s)}
.mkt span{font:600 11.5px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mkt b{font:800 20px var(--f-ui);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mkt b svg{width:12px;height:12px}
.upc{color:var(--green)} .downc{color:var(--red)} .flatc{color:var(--muted)}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.posts,.mkts{grid-template-columns:minmax(0,1fr)}}
.post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);animation:enter .4s both;animation-delay:calc(.35s + var(--n) * .28s)}
.post .avatar{width:36px;height:36px}
.p-head{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.p-head b{font:700 14px var(--f-ui)}
.p-head span{font:500 12.5px var(--f-ui);color:var(--muted)}
.post p{margin:3px 0 0;font:400 15.5px/1.4 var(--f-ui)}
.p-foot{display:flex;gap:16px;margin-top:6px;font:600 12.5px var(--f-ui);color:var(--muted)}

/* Choices, advisors, decision */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{text-align:left;border:0;border-radius:14px;padding:14px;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);font:500 16px/1.35 var(--f-ui);display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;transition:background .15s,box-shadow .15s}
.choice .ck{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font:800 13px var(--f-ui)}
.choice:hover{background:var(--surface-2)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--amber);background:rgba(242,182,80,.1)}
.choice[aria-pressed="true"] .ck{background:var(--amber);color:#1B1405}
.dil-title{margin:0;font:700 clamp(22px,2.6vw,28px)/1.15 var(--f-news)}
.advs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.advs{grid-template-columns:minmax(0,1fr)}}
.adv{border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;display:grid;gap:8px;grid-template-rows:auto 1fr auto;animation:enter .4s both;animation-delay:calc(var(--n) * .12s)}
.adv header{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.adv header b{font:800 15px var(--f-ui)}
.adv header span{font:500 13px var(--f-ui);color:var(--muted)}
.adv p{margin:0;font:400 15px/1.45 var(--f-ui);color:#D5DAE6}
.adv footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec{font:800 13px var(--f-ui);padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.rec.cut{color:#7FD6B2} .rec.hike{color:#FF9A9D}
.adv .btn[aria-pressed="true"]{background:var(--green);color:#06140E;box-shadow:none}
.decide{display:grid;gap:14px;align-content:start}
.warn-strip{display:flex;gap:10px;align-items:baseline;border-radius:12px;padding:10px 12px;background:rgba(229,72,77,.12);box-shadow:inset 0 0 0 1px rgba(229,72,77,.45);color:#FFD9DA;font:500 14.5px/1.4 var(--f-ui)}

    <div class="btns"><button class="btn ghost" id="lBack">← ${esc(gg.back)}</button>${langToggle()}${soundToggle()}</div>
  </div>`);
  $("overlay").querySelectorAll("[data-level]").forEach(b => (b.onclick = () => {

    Sound.confirm(); startLevel(b.dataset.level, code || randomCode(), [], !!store.hard);
  }));

}

function startLevel(scenario, seed, inputs = [], hard = false) {
  closeOverlay(); resetStage();
  screen = "game";
  const sc = extendScenario(buildScenario(scenario, seed), seed);
  if (hard) { const f = scenario === "oil" ? 1.15 : 1.3; ["d", "s"].forEach(k => (sc[k] = sc[k].map(v => v * f))); ["noiseD", "noiseS"].forEach(k => (sc[k] = sc[k].map(v => v * 1.4))); sc.cred = Math.max(0.3, sc.cred - 0.05); }
  game = { cfg: { scenario, seed, hard: !!hard }, sc, hist: [initGame(sc)], reports: [], inputs: [], hud: null, headlines: [] };
  g().tickerStart.forEach((x, k) => game.headlines.push({ key: "start" + k, src: "wire", textFn: () => g().tickerStart[k] }));
  inputs.forEach(advance);
  saveGame();
  drawRoom(); renderTicker();
  if (inputs.length) { if (over()) { renderHUD(cur(), null, cur().t); endLevel(true); } else beginQuarter(); return; }
  renderHUD(cur(), null, 1);
  const lines = g().intro[scenario];
  play([...lines.map(([id, mood], k) => () => say({ speaker: id, mood, text: g().intro[scenario][k][2], skip: true })), () => beginQuarter()]);
}

/* ═══════════════ A QUARTER ═══════════════ */
function beginQuarter() {
  const s = cur(), prep = (game.prep = prepGame(s, game.sc));
  draft = { move: null, tone: "neutral", choice: null, qe: 0, buy: [], macro: !!s.macro };
  resetStage(); drawRoom(); renderHUD(s, null, prep.t);
  const list = [quarterCard, newsBeat, frontPageBeat, mapBeat];
  if (prep.budget) list.push(budgetBeat);
  calls(s, prep).forEach((c, k) => list.push(() => callBeat(c, k)));
  if (prep.dilemma || prep.gd) list.push(dilemmaBeat);
  list.push(advisorsBeat, decideBeat);
  play(list.map(fn => { const b = () => fn(); b.ov = fn === quarterCard; return b; }));
}

function quarterCard() {

    <div class="qline"><i style="width:${(prep.t / M.turns) * 100}%"></i></div>

function leadStory(s, prep) {
  const t = tr();
  if (prep.gd === "crash") return { head: g().crashNews[0], dek: g().crashNews[1], breaking: true };
  if (prep.news) return { head: t.news[prep.news][0], dek: t.news[prep.news][1], breaking: true };
  const first = pressItems(s, prep)[0];
  return { head: first[1], dek: t.quietHead(pc(s.pi, 1), pc(s.x, 1)) + ". " + t.quietDek, breaking: false };
}

function newsBeat() {
  const s = seenNow(), prep = game.prep, t = tr(), gg = g(), lead = leadStory(s, prep);

  pushHeadline(`q${prep.t}-lead`, lead.breaking ? "ch9" : "wire", () => { const h = seenOf(game.hist[prep.t - 1], game.sc, prep.t - 1); return leadStory(h, prepGame(game.hist[prep.t - 1], game.sc)).head; });
  if (lead.breaking) { Sound.sting(); if (Math.abs(game.sc.d[prep.t] || 0) + Math.abs(game.sc.s[prep.t] || 0) >= 1.5) shake(); }
  say({ name: gg.anchor, role: `${gg.anchorRole} · ${lead.breaking ? t.breaking : t.dataRelease}`, text: `${lead.head}. ${lead.dek}` });

function reactionBeat(r) {

  const mk = { fx: 100 * (nx.fx / pv.fx - 1), y10: (nx.y10 - pv.y10) * 100, stocks: 100 * (nx.eq / pv.eq - 1) };
  const kicker = r.vote && !r.vote.passed ? gg.board.kickerOutvoted : r.credParts.some(q => q[0] === "caved") ? gg.kicker.pressure : Math.abs(r.surprise) >= 0.25 ? gg.kicker.surprise : gg.kicker.expected;

  pushHeadline(`q${r.state.t}-dec`, "wire", () => decisionHeadline(r));
  const arrow = (v, invert) => { const cls = Math.abs(v) < 0.05 ? "flatc" : (v > 0) !== !!invert ? "upc" : "downc"; return [cls, Math.abs(v) < 0.05 ? "" : v > 0 ? ICON.up : ICON.down]; };
  const cell = (label, v, fmt, k) => { const [cls, ic] = arrow(v); return `<div class="mkt" style="--n:${k}"><span>${esc(label)}</span><b class="${cls}">${ic}${fmt(v)}</b></div>`; };
  say({ cast: [], name: gg.reactionTitle, role: quarterLabel(r.state.t), extra: `<div class="react">
      <div class="react-head"><div class="react-src"><span>${esc(t.outlets.wire)}</span><span class="pill ${kicker === gg.kicker.expected ? "" : "hot"}">${esc(kicker)}</span></div><h3>${esc(head)}</h3></div>
      <div class="dec-row"><span class="sec-lab">${esc(gg.marketsTitle)}</span><div class="mkts">
        ${cell(gg.mkt.fx, mk.fx, v => `${sgn(v, 1)}%`, 0)}${cell(gg.mkt.y10, mk.y10, v => `${sgn(v, 0)} bp`, 1)}${cell(gg.mkt.stocks, mk.stocks, v => `${sgn(v, 1)}%`, 2)}
      </div></div>
      <div class="dec-row"><span class="sec-lab">${esc(gg.feedTitle)}</span><div class="posts">${posts.map((p, k) => postHTML(p, k, `rx${r.state.t}`)).join("")}</div></div>
    </div>` });
  if (!FAST) posts.forEach((_, k) => setTimeout(Sound.pop, 400 + k * 280));
}

function onTargetStreak() { let n = 0; for (let k = game.reports.length - 1; k >= 0; k--) { if (Math.abs(game.reports[k].state.pi - 2) < 1) n++; else break; } return n; }

function falloutBeat(r) {
  const t = tr(), gg = g(), s = r.state, p = r.prev;
  renderHUD(s, p, s.t);
  const cd = (s.cred - p.cred) * 100, pd = s.pop - p.pop, hd = s.heat - p.heat;
  setTimeout(() => { floater("hCred", sgn(cd, 0), cd >= 0); floater("hPop", sgn(pd, 0), pd >= 0); floater("hHeat", sgn(hd, 0), hd <= 0); }, 350);
  if (s.lost || cd <= -5 || pd <= -5 || hd >= 15) shake();
  (s.lost || cd + pd / 2 < 0 ? Sound.bad : Sound.good)();
  const verdict = t.verdict[(cd >= 0 ? "u" : "d") + (pd >= 0 ? "u" : "d")];
  const streak = onTargetStreak();
  const ledger = (title, total, parts, why, scale, d, inv) => `<div class="ledger"><div class="lg-h"><span>${esc(title)}</span><b class="${(inv ? -total : total) >= 0 ? "pos" : "neg"}">${sgn(total, d)}</b></div>${parts.map(([k, v]) => `<div class="lg-r"><span>${esc(why[k] || g().whyExtra[k] || k)}</span><b class="${(inv ? -v : v) >= 0 ? "pos" : "neg"}">${sgn(v * scale, d)}</b></div>`).join("")}</div>`;
  say({ cast: s.lost ? [{ id: s.govt === "opp" ? "quiroga" : "salas", mood: "angry" }] : [], name: gg.resultTitle, role: quarterLabel(s.t),
    text: s.lost ? `${t.outcome[s.lost]}. ${t.lostWhy[s.lost]}` : "",
    pre: streak >= 2 && !s.lost ? `<div class="streak">${esc(gg.streak(streak))}</div>` : "",
    extra: `<div class="ledgers">${ledger(t.credHead, cd, r.credParts, t.credWhy, 100, 0)}${ledger(t.popHead, pd, r.popParts, t.popWhy, 1, 1)}${ledger(gg.hud.heat, hd, r.heatParts, gg.heatWhy, 1, 0, true)}</div><p class="verdict-q">${esc(verdict)}</p>` });
}

function electionBeat(r) {
  const t = tr(), gg = g();
  if (typing) typing.cancel(); setCast([]); $("panel").innerHTML = "";
  const newGov = r.popParts.find(q => q[0] === "newGov");
  const share = Math.round(r.state.pop - (newGov ? newGov[1] : 0)), won = r.election === "reelected";
  const [h, body] = won ? t.elec.reelected(share) : t.elec.defeated();
  const posts = gg.elecCm[r.election];
  tvOn(h, gg.electionNight, true);
  pushHeadline("election", "ch9", () => (r.election === "reelected" ? tr().elec.reelected(share) : tr().elec.defeated())[0]);
  openOverlay(`<div class="scr">
    <span class="q-date">${esc(t.outlets.ch9)} · ${esc(quarterLabel(r.state.t))}</span>
    <h2 class="big-title">${esc(gg.electionNight)}</h2>
    <div class="elec-bust" id="elecBust">${portraitSVG("salas", "neutral")}</div>
    <div class="vote"><div class="vote-bar"><i id="voteFill" style="width:0%"></i><em></em></div><div class="vote-num"><span>${esc(gg.voteShare)}</span><b id="voteNum">0%</b><span>${esc(gg.toWin)}</span></div></div>
    <div id="elecRes" hidden style="display:grid;gap:12px;justify-items:center;width:100%"><h3 class="elec-h">${esc(h)}</h3><p class="credits">${esc(body)}</p><div class="posts">${posts.map((p, k) => postHTML(p, k, "elec")).join("")}</div></div>
    <button class="btn big" id="elecGo" data-hot>${esc(gg.cont)} →</button>
  </div>`);
  const reveal = () => {
    if (!$("elecRes")) return;
    $("voteFill").style.width = share + "%"; $("voteNum").textContent = share + "%";
    $("elecRes").hidden = false; $("elecBust").innerHTML = portraitSVG("salas", won ? "happy" : "sad");
    (won ? Sound.good : Sound.bad)();
  };
  if (FAST) reveal();
  else { let v = 0; const id = setInterval(() => { if (!$("voteFill")) return clearInterval(id); v++; $("voteFill").style.width = v + "%"; $("voteNum").textContent = v + "%"; if (v % 4 === 0) Sound.blip(); if (v >= share) { clearInterval(id); reveal(); } }, 30); }
  $("elecGo").onclick = () => { closeOverlay(); next(); };
}

/* ═══════════════ END OF LEVEL ═══════════════ */
function evalAchievements(score, rule) {
  const R = game.reports, s = cur(), got = [], finished = !s.lost && s.t >= M.turns;
  if (R.filter(r => r.credParts.some(p => p[0] === "resisted")).length >= 3) got.push("ironWill");
  if (finished) {
    if (s.cred >= 0.895) got.push("anchored");
    if (Math.abs(s.pi - 2) < 1 && Math.abs(s.x) < 1) got.push("softLanding");
    if (R.some(r => r.state.i <= 0.001)) got.push("zeroHero");
    const statements = R.filter(r => r.inp.tone !== "neutral").length, broke = R.some(r => r.credParts.some(p => p[0] === "brokeHawk" || p[0] === "brokeDove"));
    if (statements >= 3 && !broke) got.push("wordIsBond");
    if (score > rule) got.push("beatMachine");
    if ((s.heatPeak || 0) >= 70) got.push("survivor");
  }
  if (R.some(r => r.election === "reelected")) got.push("kingmaker");
  if (s.lost) got.push("hardWay");
  return got;
}

function endLevel(restored) {
  resetStage();
  const s = cur(), t = tr(), gg = g(), key = game.cfg.scenario, sk = key + (game.cfg.hard ? ":hard" : ""), H = game.hist;
  const sp = scoreGame(s), rule = scoreGame(ruleBoundGame(game.sc)).total;
  const stars = s.lost ? 0 : sp.total >= rule ? 3 : sp.total >= 0.9 * rule ? 2 : 1;
  const got = evalAchievements(sp.total, rule), fresh = got.filter(a => !store.ach[a]);
  if (!restored) {
    clearSave();
    got.forEach(a => (store.ach[a] = true));
    store.stars[sk] = Math.max(store.stars[sk] || 0, stars);
    if (!s.lost) store.best[sk] = Math.max(store.best[sk] || 0, sp.total);
    persist();
  }
  const T_ = Math.max(1, s.t), avg = (a, b) => ((b / a) ** (1 / T_) - 1) * 400;
  const elec = game.reports.find(r => r.election), nextKey = LEVEL_ORDER[LEVEL_ORDER.indexOf(key) + 1];
  const front = s.lost ? gg.finalFront[s.lost] : s.cred > 0.8 ? gg.finalFront.good : gg.finalFront.mixed;
  const qL = k => quarterLabel(k).replace(" ", "");
  openOverlay(`<div class="scr end">
    <span class="q-date">${esc(gg.levels[key][0])} · ${esc(game.cfg.seed)}${game.cfg.hard ? ` · ${esc(gg.hardTag)}` : ""}</span>
    <h2 class="big-title">${esc(s.lost ? gg.gameover : gg.complete)}</h2>
    <article class="paper front"><header class="paper-mast"><span class="pm-meta">${esc(gg.finalLabel)}</span><span class="pm-name">${esc(t.outlets.ledger)}</span><span class="pm-meta">${esc(quarterLabel(s.t + 1))}</span></header>
      <div class="paper-lead"><span class="kicker">${esc(s.lost ? t.outcome[s.lost] : t.outcome.done)}</span><h3>${esc(front)}</h3><p>${esc(s.lost ? t.lostWhy[s.lost] : t.epilogue(s.cred))}</p></div></article>
    <div class="stars">${starRow(stars)}</div>
    <div class="score"><span>${esc(t.score)}</span><b id="scoreNum">${FAST ? sp.total : 0}</b></div>
    <dl>
      <dt>${esc(t.parts.macro)}</dt><dd>${sp.macro}</dd><dt>${esc(t.parts.cred)}</dt><dd>${sp.cred}</dd><dt>${esc(t.parts.pop)}</dt><dd>${sp.pop}</dd>
      <dt>${esc(gg.instBuilt)}</dt><dd style="white-space:normal">${esc(DEPTS.map(k => `${gg.depts[k][0]} ${(s.dept || initDept())[k]}`).join(" · "))}</dd>
      <dt>${esc(gg.peakHeat)}</dt><dd>${Math.round(s.heatPeak || 0)}</dd>
      <dt>${esc(gg.ruleBound)}</dt><dd>${rule}</dd>
      <dt>${esc(t.avgGdp)}</dt><dd>${pc(avg(H[0].Y, s.Y))}</dd><dt>${esc(t.avgPrice)}</dt><dd>${pc(avg(H[0].P, s.P))}</dd>
      ${elec ? `<dt>${esc(t.elecRes)}</dt><dd>${esc(elec.election === "reelected" ? t.elec.reelected(0)[0] : t.elec.defeated()[0])}</dd>` : ""}
    </dl>
    <p class="note">${esc(gg.starsNote)}</p>
    ${fresh.length ? `<div class="achs"><span class="sec-lab">${esc(gg.newAch)}</span>${fresh.map(a => `<div class="ach"><b>${esc(gg.ach[a][0])}</b><small>${esc(gg.ach[a][1])}</small></div>`).join("")}</div>` : ""}
    <div class="end-charts">${["infl", "mkt", "pol"].map(k => chartCard(k, qL, true)).join("")}</div>
    <div class="btns">
      <button class="btn big" id="eRetry" data-hot>${esc(gg.retry)}</button>
      <button class="btn ghost" id="eFresh">${esc(gg.newShocks)}</button>
      ${nextKey && !s.lost ? `<button class="btn ghost" id="eNext">${esc(gg.nextLevel)} →</button>` : ""}
      <button class="btn ghost" id="eLevels">${esc(gg.toLevels)}</button>
    </div>
  </div>`);
  $("eRetry").onclick = () => { Sound.confirm(); startLevel(key, game.cfg.seed, [], game.cfg.hard); };
  $("eFresh").onclick = () => { Sound.confirm(); startLevel(key, randomCode(), [], game.cfg.hard); };
  if ($("eNext")) $("eNext").onclick = () => { Sound.confirm(); startLevel(nextKey, randomCode(), [], game.cfg.hard); };
  $("eLevels").onclick = levelSelect;
  if (restored || FAST) return;
  if (stars === 3) confetti();
  (s.lost ? Sound.bad : Sound.good)();
  for (let k = 0; k < stars; k++) setTimeout(() => Sound.star(k), 400 + k * 400);
  const t0 = performance.now();
  const stepF = now => { const el = $("scoreNum"); if (!el) return; const f = Math.min(1, (now - t0) / 1400); el.textContent = Math.round(sp.total * (1 - (1 - f) ** 3)); if (f < 1) requestAnimationFrame(stepF); };
  requestAnimationFrame(stepF);
}

/* ═══════════════ CHARTS, MENU ═══════════════ */
function chartSpec(kind, reveal) {
  const now = cur().t, H = reveal ? game.hist : game.hist.map(h => seenOf(h, game.sc, now)), c = g().chart;
  if (kind === "infl" && reveal) return { title: c.infl, keys: [[c.infl, "#E5484D"], [c.first, "#F2B650"]], series: [{ values: game.hist.map(h => h.pi + (game.sc.errPi[h.t] || 0)), color: "#F2B650", dash: true }, { values: H.map(h => h.pi), color: "#E5484D", area: true }], band: [1, 3], include: [0, 4] };
  if (kind === "infl") return { title: c.infl, keys: [[c.infl, "#E5484D"], [c.exp, "#9AA4BD"]], series: [{ values: H.map(h => h.pe), color: "#9AA4BD", dash: true }, { values: H.map(h => h.pi), color: "#E5484D", area: true }], band: [1, 3], include: [0, 4] };
  if (kind === "gap") return { title: c.gap, keys: [], series: [{ values: H.map(h => h.x), color: "#5B9BD5", bars: true }], include: [-2, 2] };
  if (kind === "rate") return { title: c.rate, keys: [[c.rate, "#3FB68B"], [c.y10, "#C4A0FF"]], series: [{ values: H.map(h => h.i), color: "#3FB68B", step: true }, { values: H.map(h => h.y10 || Y10_NEUTRAL), color: "#C4A0FF" }], include: [0, 5] };
  if (kind === "mkt") return { title: c.mkt, keys: [[c.eq, "#5B9BD5"], [c.fx, "#F2B650"]], series: [{ values: H.map(h => h.eq || 100), color: "#5B9BD5", area: true }, { values: H.map(h => h.fx || 100), color: "#F2B650" }], include: [92, 108] };
  return { title: c.pol, keys: [[c.cred, "#3FB68B"], [c.pop, "#F2B650"], [c.heat, "#E5484D"]], series: [{ values: H.map(h => h.cred * 100), color: "#3FB68B", area: true }, { values: H.map(h => h.pop), color: "#F2B650" }, { values: H.map(h => h.heat || 0), color: "#E5484D" }], fixed: [0, 100], refs: [50] };
}
function chartCard(kind, qL, reveal) {
  const spec = chartSpec(kind, reveal);
  return `<div class="chart-card"><header><h4>${esc(spec.title)}</h4><span class="keys">${spec.keys.map(([n, c]) => `<span style="--c:${c}">${esc(n)}</span>`).join("")}</span></header>${chartSVG(spec, qL)}</div>`;
}
function openCharts() {
  if (!game) return;
  cardToken = null;
  const gg = g(), qL = k => quarterLabel(k).replace(" ", "");
  openOverlay(`<div class="scr"><h2 class="scr-title">${esc(gg.chartsTitle)}</h2>
    <div class="chart-grid">${["infl", "gap", "rate", "mkt", "pol"].map(k => chartCard(k, qL)).join("")}</div>
    <button class="btn big" id="chClose" data-hot>${esc(gg.close)}</button></div>`);
  $("chClose").onclick = resume;
}
function openMap() {
  if (!game) return;
  cardToken = null;
  const gg = g(), s = seenOf(cur(), game.sc, cur().t);
  openOverlay(`<div class="scr"><h2 class="scr-title">${esc(gg.map.title)}</h2><div id="mapOv" class="map-ov"></div>
    <button class="btn big" id="mapClose" data-hot>${esc(gg.close)}</button></div>`);
  mountMap($("mapOv"), s, game.mapLayer || "prices");
  $("mapClose").onclick = resume;
}
function resume() { closeOverlay(); const b = beats[beatIdx]; if (b && b.ov) b(); }
function openMenu() {
  if (!game) return;
  cardToken = null;
  const gg = g();
  if (typing) typing.finish();
  openOverlay(`<div class="scr"><h2 class="scr-title">${esc(gg.paused)}</h2>
    <div class="menu-btns">
      <button class="btn big" id="mResume" data-hot>${esc(gg.resume)}</button>
      <button class="btn ghost" id="mRestart">${esc(gg.restart)}</button>
      <button class="btn ghost" id="mLevels">${esc(gg.quit)}</button>
      <button class="btn ghost" id="mTitle">${esc(gg.toTitle)}</button>
    </div>
    <div class="toggles">${langToggle()}${soundToggle()}</div>
    <p class="hint">${esc(gg.codeLine(game.cfg.seed))}</p></div>`);
  $("mResume").onclick = resume;
  $("mRestart").onclick = () => startLevel(game.cfg.scenario, game.cfg.seed, [], game.cfg.hard);
  $("mLevels").onclick = levelSelect;
  $("mTitle").onclick = titleScreen;
  bindToggles(() => { closeOverlay(); if (game.hud) renderHUD(game.hud.s, null, game.hud.turn); drawRoom(); renderTicker(); rerunBeat(); openMenu(); });
}

/* ═══════════════ INPUT & BOOT ═══════════════ */
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  const ovOpen = !$("overlay").hidden, scope = ovOpen ? $("overlay") : $("frame");
  if (e.key === " " || e.key === "Enter") {
    if (e.target.closest && e.target.closest("button")) return;
    const b = scope.querySelector("[data-hot]:not(:disabled)"); if (b) { e.preventDefault(); b.click(); } return;
  }
  if (/^[1-9]$/.test(e.key)) { const b = scope.querySelector(`[data-key="${e.key}"]:not(:disabled)`); if (b) { e.preventDefault(); b.click(); } return; }
  if (!ovOpen && game && game.nudge && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); game.nudge(e.key === "ArrowLeft" ? -1 : 1); return; }
  if (e.key === "Escape" && screen === "game") { if (ovOpen) { if ($("mResume") || $("chClose") || $("mapClose")) resume(); } else openMenu(); }
});

function start(data) {
  document.documentElement.lang = lang;
  if (!FAST) $("room").addEventListener("mousemove", e => { const r = $("room").getBoundingClientRect(); $("room").style.setProperty("--px", ((e.clientX - r.left) / r.width - 0.5).toFixed(3)); $("room").style.setProperty("--py", ((e.clientY - r.top) / r.height - 0.5).toFixed(3)); });
  if (data && data.screen === "game" && data.cfg) startLevel(data.cfg.scenario, data.cfg.seed, data.inputs || [], !!data.cfg.hard);
  else if (data && data.screen === "levels") levelSelect();
  else titleScreen();
  window.claude?.hot?.snapshot?.(() => ({ screen, cfg: game?.cfg, inputs: game?.inputs, lang }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

})();
</script>
